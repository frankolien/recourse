<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  :root { --in: cubic-bezier(0.23, 1, 0.32, 1); --out: cubic-bezier(0.4, 0, 1, 1); --move: cubic-bezier(0.4, 0, 0.2, 1); }
  .copy { position: absolute; left: 160px; top: 360px; width: 860px; }
  .copy h1 { margin: 0; font-size: 108px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
  .copy h1 span { display: block; opacity: 0; animation: rise 500ms var(--in) both, leave 250ms 4600ms var(--out) forwards; }
  .copy h1 span:nth-child(1) { animation-delay: 200ms, 4600ms; }
  .copy h1 span:nth-child(2) { animation-delay: 270ms, 4600ms; }
  .copy p { margin: 28px 0 0; font-size: 34px; line-height: 1.35; color: var(--muted); max-width: 24ch; opacity: 0; animation: rise 500ms 700ms var(--in) both, leave 250ms 4600ms var(--out) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-10px); } }

  .rig { position: absolute; right: 250px; top: 100px; width: calc(880px * 1179 / 2556); height: 880px; transform-origin: 50% 60%; animation: drift 5000ms var(--move) both; }
  @keyframes drift { from { transform: perspective(2600px) rotateY(-6deg) rotateX(1deg) translateY(0); } to { transform: perspective(2600px) rotateY(-2deg) rotateX(0deg) translateY(-14px); } }
  .rig .phone { --h: 880px; left: 0; top: 0; }

  /* The balance, redrawn over the screenshot so it can count up. The patch carries
     the same gradient the screen has at that height, so it has no edge. */
  .patch { position: absolute; left: calc(240 / 1179 * 100%); top: calc(552 / 2556 * 100%); width: calc(700 / 1179 * 100%); height: calc(150 / 2556 * 100%); background: linear-gradient(#061410, #06100d); display: flex; align-items: center; justify-content: center; font-family: "SF Pro Rounded", ui-rounded, Geist, system-ui; font-weight: 700; font-size: calc(880px * 0.0465); letter-spacing: -0.02em; color: #edf2ed; font-variant-numeric: tabular-nums; }
  .patch small { font-size: inherit; color: #8c9991; }
</style>
<div class="stage">
  <div class="copy">
    <h1><span>Dollars on</span><span>your phone.</span></h1>
    <p>A balance, the people you pay, and what happens between you.</p>
  </div>
  <div class="rig">
    <div class="phone">
      <div class="screen"><img src="assets/home.png"><div class="patch" id="bal"></div></div>
      <div class="island"></div><div class="glare"></div>
    </div>
  </div>
</div>
<script>
  const target = 47.98;
  const start = 1000, span = 1500;
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  window.__tick = (ms) => {
    const u = Math.max(0, Math.min(1, (ms - start) / span));
    const v = target * ease(u);
    const [w, c] = v.toFixed(2).split(".");
    document.getElementById("bal").innerHTML = `$${w}<small>.${c}</small>`;
  };
  window.__tick(0);
</script>
