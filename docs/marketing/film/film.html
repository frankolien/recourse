<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  html, body { background: #f6faf7; }
  .pool { position: absolute; width: 1500px; height: 1500px; border-radius: 50%; background: radial-gradient(closest-side, rgba(7, 91, 70, 0.20), rgba(7, 91, 70, 0.07) 45%, rgba(7, 91, 70, 0) 70%); }
  .copy { position: absolute; top: 340px; width: 860px; opacity: 0; will-change: transform, opacity; }
  .copy.left { left: 160px; }
  .copy.right { left: 1010px; }
  .copy.narrow { width: 560px; }
  .copy h1 { margin: 0; font-size: 108px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
  .copy.narrow h1 { font-size: 92px; }
  .copy p { margin: 28px 0 0; font-size: 34px; line-height: 1.35; color: var(--muted); max-width: 24ch; }
  .copy.narrow p { font-size: 30px; max-width: 18ch; }
  .rig { position: absolute; left: 0; top: 0; width: calc(880px * 1179 / 2556); height: 880px; will-change: transform; }
  .rig .phone { --h: 880px; left: 0; top: 0; }
  .phone .island { top: calc(var(--h) * 0.014); height: calc(var(--h) * 0.044); width: calc(var(--w) * 0.46); }
  .phone .screen img#over { position: absolute; inset: 0; opacity: 0; }
  .patch { position: absolute; left: calc(240 / 1179 * 100%); top: calc(552 / 2556 * 100%); width: calc(700 / 1179 * 100%); height: calc(150 / 2556 * 100%); background: linear-gradient(#061410, #06100d); display: flex; align-items: center; justify-content: center; font-family: "SF Pro Rounded", ui-rounded, Geist, system-ui; font-weight: 700; font-size: calc(880px * 0.0465); letter-spacing: -0.02em; color: #edf2ed; font-variant-numeric: tabular-nums; }
  .patch small { font-size: inherit; color: #8c9991; }
  /* The three keys, drawn beside the phone during the keys beat. */
  .keys { position: absolute; left: 1250px; top: 300px; width: 520px; display: flex; flex-direction: column; gap: 18px; }
  .key { display: flex; align-items: center; gap: 18px; padding: 22px 26px; background: #fff; border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 30px 60px -30px rgba(17, 27, 25, 0.25); opacity: 0; }
  .key i { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--mint); display: grid; place-items: center; }
  .key i::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(7, 91, 70, 0.18); }
  .key b { display: block; font-size: 27px; font-weight: 600; letter-spacing: -0.01em; }
  .key span { display: block; font-size: 20px; color: var(--muted); margin-top: 2px; }
  .rule { align-self: flex-start; margin-top: 8px; padding: 12px 20px; border-radius: 999px; background: var(--green); color: #fff; font-size: 22px; font-weight: 500; opacity: 0; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; opacity: 0; }
  .card img { width: 128px; height: 128px; border-radius: 30px; }
  .card h1 { margin: 0; font-size: 84px; font-weight: 600; letter-spacing: -0.035em; }
  .card p { margin: 0; font-size: 30px; color: var(--muted); }
  .card p b { color: var(--green); font-weight: 500; }
</style>
<div class="stage">
  <div class="pool" id="pool1"></div><div class="pool" id="pool2"></div>
  <div id="copies"></div>
  <div class="keys" id="keys">
    <div class="key"><i></i><div><b>Device Key</b><span>In this iPhone's Secure Enclave</span></div></div>
    <div class="key"><i></i><div><b>Cloud Key</b><span>In your iCloud Keychain</span></div></div>
    <div class="key"><i></i><div><b>Recovery Key</b><span>Sealed, for the day a phone is lost</span></div></div>
    <div class="rule">Any two sign. Recourse holds none.</div>
  </div>
  <div class="rig" id="rig"><div class="phone"><div class="screen"><img id="shot" src="assets/home.png"><img id="over" src="assets/home.png"><div class="patch" id="bal"></div></div><div class="island"></div><div class="glare"></div></div></div>
  <div class="card" id="card"><img src="assets/mark.png"><h1>Recourse</h1><p>Beta on TestFlight <b>@useRecourse</b></p></div>
</div>
<script>
  // One timeline. A beat parks the phone on a side; "enter" says how the phone
  // arrives: a swing across the frame with the cut hidden edge-on, or a fade
  // with a small dip. A zoom pushes into the screen around a point (fx, fy)
  // between inAt and outAt, the way Screen Studio does.
  const FPS = 60;
  const BEATS = [
    { id: "home", ms: 4500, side: "right", h1: ["Dollars on", "your phone."], p: "A balance, the people you pay, and what happens between you." },
    { id: "send", ms: 6000, side: "right", enter: "fade", frames: 391, h1: ["Sent by", "name."], p: "Type a handle, hold Face ID, done.", zoom: { inAt: 2100, outAt: 3600, fx: 0.5, fy: 0.13, z: 1.3 } },
    { id: "cheque", ms: 5300, side: "left", enter: "swing", frames: 333, h1: ["Write a", "cheque."], p: "They cash it when they like. Void it before they do.", zoom: { inAt: 3400, outAt: 4500, fx: 0.5, fy: 0.42, z: 1.22 } },
    { id: "keys", ms: 4800, side: "center", enter: "swing", frames: 120, narrow: true, h1: ["Your keys.", "Your rules."], p: "Two of three sign every payment. No seed phrase." },
    { id: "convert", ms: 4100, side: "right", enter: "swing", frames: 246, h1: ["Dollars to", "euros."], p: "The rate is checked before you sign." },
    { id: "earn", ms: 4600, side: "right", enter: "fade", frames: 291, h1: ["Idle dollars", "earn."], p: "Deposit and withdraw any time.", zoom: { inAt: 200, outAt: 1500, fx: 0.5, fy: 0.3, z: 1.3 } },
    { id: "teams", ms: 3600, side: "right", enter: "fade", frames: 227, h1: ["Approve", "together."], p: "A team account with rules the chain enforces.", zoom: { inAt: 1500, outAt: 2800, fx: 0.5, fy: 0.55, z: 1.2 } },
    { id: "close", ms: 3000, enter: "drop" },
  ];
  let total = 0; for (const b of BEATS) { b.start = total; total += b.ms; b.end = total; }
  const SWING = 700, FADE = 500, ZOOM = 600;
  const X = { right: 1300, left: 230, center: 757 }, RY = { right: -6, left: 6, center: 0 };

  const copies = document.getElementById("copies");
  for (const b of BEATS) {
    if (b.h1) {
      const el = document.createElement("div");
      el.className = "copy " + (b.side === "left" ? "right" : "left") + (b.narrow ? " narrow" : "");
      el.innerHTML = `<h1><span>${b.h1[0]}</span><br><span>${b.h1[1]}</span></h1><p>${b.p}</p>`;
      copies.appendChild(el); b.el = el;
    }
    if (b.frames) b.cache = Array.from({ length: b.frames }, (_, i) => { const im = new Image(); im.src = `work/${b.id}/${String(i + 1).padStart(4, "0")}.jpg`; return im; });
  }
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const easeOut = (u) => 1 - Math.pow(1 - u, 3);
  const easeInOut = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const easeIn = (u) => u * u * u;
  const frameOf = (b, local) => b?.cache ? b.cache[Math.max(0, Math.min(b.frames - 1, Math.floor(local / 1000 * FPS)))].src : "assets/home.png";
  const $ = (id) => document.getElementById(id);
  const shot = $("shot"), over = $("over"), bal = $("bal"), rig = $("rig"), card = $("card");
  const keyEls = [...document.querySelectorAll("#keys .key, #keys .rule")];

  window.__tick = (ms) => {
    let k = BEATS.findIndex((b) => ms < b.end); if (k < 0) k = BEATS.length - 1;
    const b = BEATS[k], local = ms - b.start, prev = BEATS[k - 1], next = BEATS[k + 1];

    // Screen. A fade boundary cross-dissolves the next first frame over the
    // last one; a swing boundary cuts at the edge-on moment.
    const shown = b.cache ? b : (prev ?? b);
    shot.src = frameOf(shown, b.cache ? local : 1e9);
    bal.style.display = b.id === "home" ? "flex" : "none";
    if (b.id === "home") { const v = 47.98 * easeOut(clamp((ms - 1000) / 1500)); const [w, c] = v.toFixed(2).split("."); bal.innerHTML = `$${w}<small>.${c}</small>`; }
    let overOpacity = 0;
    if (next?.enter === "fade" && local > b.ms - FADE / 2) { over.src = frameOf(next, 0); overOpacity = easeInOut((local - (b.ms - FADE / 2)) / FADE); }
    over.style.opacity = overOpacity;

    // Copy rises 250ms in, leaves 400ms before the end. Two beats on the same
    // side hand over through the leave and rise, so the swap reads as a change
    // of line, not a cut.
    for (const c of BEATS) {
      if (!c.el) continue;
      const l = ms - c.start; let o = 0, y = 18;
      if (l >= 250 && l < c.ms - 400) { const u = easeOut(clamp((l - 250) / 500)); o = u; y = 18 * (1 - u); }
      else if (l >= c.ms - 400 && l < c.ms) { const u = easeIn(clamp((l - (c.ms - 400)) / 250)); o = 1 - u; y = -10 * u; }
      c.el.style.opacity = o; c.el.style.transform = `translateY(${y}px)`;
    }

    // Keys fan in one after another while the phone sits in the middle.
    keyEls.forEach((el, i) => {
      const l = ms - BEATS[3].start - 700 - i * 220; let o = 0, x = 24;
      if (l >= 0 && ms < BEATS[3].end - 400) { const u = easeOut(clamp(l / 500)); o = u; x = 24 * (1 - u); }
      else if (ms >= BEATS[3].end - 400 && ms < BEATS[3].end) { const u = easeIn(clamp((ms - (BEATS[3].end - 400)) / 250)); o = 1 - u; x = 16 * u; }
      el.style.opacity = o; el.style.transform = `translateX(${x}px)`;
    });

    // Phone.
    const side = b.side ?? prev.side;
    const drift = easeInOut(clamp(local / b.ms));
    let x = X[side], y = 100 - 12 * drift, ry = RY[side] + (side === "right" ? 4 : side === "left" ? -4 : 0) * drift, rz = 0, s = 1;
    const swing = (from, to, u) => {
      const e = easeInOut(u), dir = Math.sign(X[to] - X[from]) || 1, amp = Math.min(1, Math.abs(X[to] - X[from]) / 1070);
      x = X[from] + (X[to] - X[from]) * e; ry = RY[from] + (RY[to] - RY[from]) * e - dir * 70 * amp * Math.sin(u * Math.PI);
      y = 100 + 40 * amp * Math.sin(u * Math.PI); s = 1 - 0.07 * amp * Math.sin(u * Math.PI); rz = -dir * 3 * amp * Math.sin(u * Math.PI);
    };
    const dip = (u) => { y += 26 * Math.sin(u * Math.PI); s = 1 - 0.02 * Math.sin(u * Math.PI); };
    if (b.enter === "drop") {
      const u = easeIn(clamp(local / 900));
      x = X[prev.side] + (960 - 203 - X[prev.side]) * easeInOut(clamp(local / 900)); y = 100 + 1100 * u; s = 1 - 0.15 * u; ry = RY[prev.side] * (1 - u);
      const c = easeOut(clamp((local - 500) / 600)); card.style.opacity = c; card.style.transform = `translateY(${18 * (1 - c)}px)`;
    } else if (b.enter === "swing" && local < SWING / 2) swing(prev.side, side, 0.5 + local / SWING);
    else if (next?.enter === "swing" && local > b.ms - SWING / 2) swing(side, next.side, (local - (b.ms - SWING / 2)) / SWING);
    else if (b.enter === "fade" && local < FADE / 2) dip(0.5 + local / FADE);
    else if (next?.enter === "fade" && local > b.ms - FADE / 2) dip((local - (b.ms - FADE / 2)) / FADE);

    // Zoom: push in around the focus point, hold, pull out.
    let z = 1, fx = 0.5, fy = 0.5;
    if (b.zoom) {
      const { inAt, outAt } = b.zoom; fx = b.zoom.fx; fy = b.zoom.fy;
      const u = local < outAt ? easeInOut(clamp((local - inAt) / ZOOM)) : 1 - easeInOut(clamp((local - outAt) / ZOOM));
      z = 1 + (b.zoom.z - 1) * u;
    }
    rig.style.transformOrigin = `${fx * 100}% ${fy * 100}%`;
    rig.style.transform = `translate(${x}px, ${y}px) perspective(2600px) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s * z})`;

    const p = ms / total;
    $("pool1").style.transform = `translate(${-500 + 500 * p}px, ${-700 + 300 * p}px)`;
    $("pool2").style.transform = `translate(${1100 - 300 * p}px, ${400 + 200 * p}px)`;
  };
  window.__tick(0);
</script>
